spring.application.name=Masar Backend

# Database (MySQL) - override with environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/masar?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Dev only: auto-create/update tables from entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
# Required: set the JWT_SECRET env var (Base64, at least 32 bytes). Generate with: openssl rand -base64 48
jwt.secret=${JWT_SECRET}
# Token lifetime in milliseconds (3600000 = 1 hour)
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Email via Resend SMTP (https://resend.com). Set RESEND_API_KEY as an environment variable.
spring.mail.host=${MAIL_HOST:smtp.resend.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:resend}
spring.mail.password=${RESEND_API_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Sender address. For testing use onboarding@resend.dev (can only send to your own Resend account email).
# For real users, verify your own domain in Resend and use e.g. no-reply@yourdomain.com
app.mail.from=${MAIL_FROM:onboarding@resend.dev}

# Redis (stores the verification codes, they expire by themselves)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Cache (@Cacheable) uses Redis. TTL per cache is set in CacheConfig
spring.cache.type=redis

# File storage (Supabase). Set SUPABASE_URL and SUPABASE_SECRET_KEY as environment variables.
# The secret key must stay on the server: never put it in the frontend or in git.
supabase.url=${SUPABASE_URL}
supabase.secret-key=${SUPABASE_SECRET_KEY}
supabase.bucket=${SUPABASE_BUCKET:cvs}

# Uploads: Spring's default limit is 1MB, a CV can be bigger (the bucket itself also stops at 5MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
